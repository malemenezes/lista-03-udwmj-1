<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica 03 - Exercicio 03</title>
    <link rel="stylesheet" href="pratica03e03.css">
</head>

<body>
    <script>

        var n1 = prompt("Digite o primeiro número:");
        var n2 = prompt("Digite o segundo número:");

        n1 = parseFloat(n1);
        n2 = parseFloat(n2);


        var soma = n1 + n2;
        var subtracao = n1 - n2;
        var multiplicacao = n1 * n2;
        var divisao = n1 / n2;
        var resto = n1 % n2;

        document.write("<div class='numero'> Primeiro número: " + n1 + "</div>");
        document.write("<div class='numero'> Segundo número: " + n2 + "</div>");

        document.write("<div id='soma'> Soma: " + soma + "</div>");
        document.write("<div id='subtracao'> Subtração: " + subtracao + "</div>");
        document.write("<div id='multiplicacao'> Multiplicação: " + multiplicacao + "</div>");
        document.write("<div id='divisao'> Divisão: " + divisao + "</div>");
        document.write("<div id='resto'> Resto: " + resto + "</div>");

    </script>
</body>

</html>
