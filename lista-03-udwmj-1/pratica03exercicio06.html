<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juros Compostos</title>
    <link rel="stylesheet" href="pratica03exercicio06.css">
</head>

<body>

    <main class="container">
        <h1>Juros Compostos</h1>

        <p>Informe os dados do investimento.</p>

        <label for="capital">Capital inicial:</label>
        <input type="number" id="capital" placeholder="Ex: 1000" step="any">

        <label for="taxa">Taxa de juros (%):</label>
        <input type="number" id="taxa" placeholder="Ex: 10" step="any">

        <label for="tempo">Tempo:</label>
        <input type="number" id="tempo" placeholder="Ex: 12" step="any">

        <button onclick="calcularJuros()">Calcular Montante</button>

        <div id="resultado"></div>
    </main>

    <script src="pratica03exercicio06.js"></script>
</body>

</html>
